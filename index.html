["الحساب","بسيط","ما قيمة 25% من 80؟",["20","15","25","40"],"80 × 0.25 = 20"],

["استيعاب المقروء","متوسط","متى تتضاعف فائدة القراءة بحسب النص؟",["عند التأمل والمناقشة","عند القراءة بسرعة","عند القراءة ليلًا","عند حفظ النص"],"ذكر النص ذلك في جملته الأخيرة",P1],

function home(){app.innerHTML='<div class="c"><div style="font-size:46px;text-align:center">🎓</div><div style="text-align:center;color:var(--fl);font-weight:700">ثانوية أنس بن النضر</div><h1 style="text-align:center">محاكي اختبار القدرات</h1><div class="enc">أهلًا بك يا بطل! 🌟 كل محاولة تقرّبك من التميّز، فثق بنفسك وانطلق بإذن الله.</div><p class="mu">'+Q.length+' سؤالًا: كمي (الحساب، الجبر، الهندسة، الإحصاء) ولفظي (التناظر، إكمال الجمل، المفردة الشاذة، استيعاب المقروء)، بواقع 4 أسئلة لكل قسم. يُكتب مستوى صعوبة كل سؤال قبله.</p><p>المدة: '+Math.round(T/60)+' دقيقة. في النهاية تحصل على تقرير بنتيجتك تحتفظ به لتسلّمه لمعلمك عند الطلب.</p><div class="enc" style="text-align:start">❓ سؤال اختياري: هل أنت من طلاب ثانوية أنس بن النضر؟</div><button class="o" id="aY" onclick="aff(1)">نعم، أنا من طلاب المدرسة</button><button class="o" id="aN" onclick="aff(0)">لا، لا أنتمي للمدرسة وأريد التدرب فقط</button><div style="height:12px"></div><button class="b" onclick="start()">ابدأ الاختبار</button></div>'}
function start(){Q=draw();Q.forEach(function(x){x.o=sh(x.o);x.a=x.o.indexOf(x.c)});ans=[];flg=[];cur=0;left=T;clearInterval(tick);tick=setInterval(function(){left--;var e=document.getElementById("tm");if(e)e.textContent=fmt(left);if(left<=0)finish()},1000);show()}

if(x.p)h+='<div class="psg">'+x.p+'</div>';

x.o.forEach(function(t,i){h+='<button class="o'+(ans[cur]===i?' s':'')+'" onclick="pick('+i+')">'+t+'</button>'});
h+='<div class="row"><button class="b g" onclick="flag()">'+(flg[cur]?'إلغاء التعليم':'علّم للمراجعة')+'</button><span><button class="b g" onclick="go(-1)"'+(cur?'':' disabled')+'>السابق</button> '+(cur<Q.length-1?'<button class="b" onclick="go(1)">التالي</button>':'<button class="b" onclick="finish()">إنهاء</button>')+'</span></div><div class="nav">';
Q.forEach(function(_,i){h+='<button class="'+(ans[i]!==undefined?'a ':'')+(flg[i]?'f ':'')+(i==cur?'cur':'')+'" onclick="cur='+i+';show()">'+(i+1)+'</button>'});
app.innerHTML=h+'</div><div class="row"><button class="b g" onclick="if(confirm(\'إنهاء الاختبار وعرض النتيجة؟\'))finish()">إنهاء الاختبار</button></div></div>'}
var AF=-1;
function dl(){var t=document.getElementById("rp"),m=document.getElementById("dm"),no="التنزيل غير متاح هنا، استخدم زر نسخ التقرير بالأسفل.";
if(!window.claude||!claude.use){try{var b=new Blob(["\ufeff"+t.value],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="نتيجة-محاكي-القدرات.txt";document.body.appendChild(a);a.click();a.remove();m.textContent="تم تنزيل الملف ✅"}catch(e){m.textContent=no}return}

return d.save({filename:"نتيجة-محاكي-القدرات.txt",data:"\ufeff"+t.value}).then(function(){m.textContent="تم حفظ الملف ✅"},function(e){m.textContent=e&&e.code==="declined"?"لم يُحفظ الملف.":no})},function(){m.textContent=no})}

function intro(){app.innerHTML='<div class="c" style="text-align:center"><div style="font-size:46px">📚</div><div style="color:var(--fl);font-weight:700">ثانوية أنس بن النضر</div><h1>محاكي اختبار القدرات</h1><p class="mu" style="margin:0">تدريب ذكي يقرّبك من هدفك</p></div>'+

'<div class="c"><h2>🚀 هذه بداية الرحلة فقط</h2><p style="margin:0">استفادتك من هذا المحاكي خطوة أولى، وستتبعه بإذن الله <b>محاكيات قادمة</b> تعزّز قوتك في القدرات وترفع مستواك قسمًا بعد قسم. فاستفد من هذه التجربة كاملة، وحلّل أخطاءك، وابنِ عليها، وترقّب الجديد القادم الذي نُعدّه لك لتصل إلى أعلى الدرجات. 🏆</p></div>'+
'<div class="row" style="justify-content:center"><button class="b" onclick="home()">التالي ← ابدأ رحلتك</button></div>'+
'<div class="c" style="margin-top:14px;text-align:center;font-size:clamp(11px,3.3vw,16px);white-space:nowrap;padding:20px 6px"><h2>إعداد وإشراف</h2><div>👨‍🏫 <b>الأستاذ عبدالله المرواني</b></div><div>🏫 مدير المدرسة: <b>الأستاذ ياسر العوفي</b></div></div>';window.scrollTo(0,0)}

function msg(){if(cur==Math.floor(Q.length/2))return"وصلت إلى منتصف الطريق، أنت بطل! 🏅";if(cur==Q.length-1)return"السؤال الأخير! اختم بقوة، أنت قريب من النجاح 🏁";return ans[cur]===undefined?"خذ نفسًا عميقًا وفكّر بهدوء، أنت تستطيع 🌟":E[cur%E.length]}
function pick(i){ans[cur]=i;show()}function flag(){flg[cur]=!flg[cur];show()}function go(d){cur+=d;show()}
function finish(){clearInterval(tick);var used=T-Math.max(left,0),ok=0,S={},D={},L=[];
Q.forEach(function(x,i){var r=ans[i]===x.a;if(r)ok++;S[x.s]=S[x.s]||[0,0,x.k];S[x.s][1]++;if(r)S[x.s][0]++;D[x.d]=D[x.d]||[0,0];D[x.d][1]++;if(r)D[x.d][0]++;
L.push((i+1)+") ["+x.k+" - "+x.s+" - "+x.d+"] "+(ans[i]===undefined?"لم يُجب":(r?"صح":"خطأ — اختار: "+x.o[ans[i]]+" | الصحيح: "+x.c))+(flg[i]?" (عُلّم للمراجعة)":""))});
var p=Math.round(ok/Q.length*100),h='<div class="c"><h2>النتيجة</h2><div class="sc">'+p+'%</div><div class="enc">'+(p>=80?"ما شاء الله! أداء ممتاز، واصل التألق 🏆":p>=60?"أداء جيد جدًا! بقليل من التدريب ستصل إلى القمة 🌟":p>=40?"بداية طيبة، والتدريب المستمر سيصنع الفرق 💪":"لا تحزن، كل متميّز بدأ من هنا. حلّل أخطاءك وعاود المحاولة 🌱")+'</div><p class="mu" style="text-align:center">'+ok+' صحيحة من '+Q.length+' · الزمن المستغرق '+fmt(used)+'</p><h2>حسب القسم</h2>';
var rep="تقرير محاكي القدرات – إعداد الأستاذ عبدالله المرواني – ثانوية أنس بن النضر (جميع الحقوق محفوظة)\nالانتماء: "+affTxt()+"\nالنتيجة: "+ok+"/"+Q.length+" ("+p+"%) | الزمن: "+fmt(used)+" من "+fmt(T)+"\n\nحسب القسم:\n";
for(var k in S){h+='<p style="margin:6px 0 0">'+k+' ('+S[k][2]+'): '+S[k][0]+' من '+S[k][1]+'</p><div class="bar"><i style="width:'+(S[k][0]/S[k][1]*100)+'%"></i></div>';rep+="- "+k+" ("+S[k][2]+"): "+S[k][0]+"/"+S[k][1]+"\n"}
h+='<h2 style="margin-top:14px">حسب الصعوبة</h2>';rep+="\nحسب الصعوبة:\n";
["بسيط","متوسط","صعب"].forEach(function(k){h+='<p style="margin:4px 0">'+k+': '+D[k][0]+' من '+D[k][1]+'</p>';rep+="- "+k+": "+D[k][0]+"/"+D[k][1]+"\n"});
rep+="\nتفصيل الأسئلة:\n"+L.join("\n")+"\n\nأرجو تحليل أدائي وتحديد نقاط الضعف وخطة تدريب.\n\n© المحاكي من إعداد الأستاذ عبدالله المرواني، ثانوية أنس بن النضر، جميع الحقوق محفوظة.";
h+='</div><div class="c"><h2>📄 تقرير نتيجتك</h2><p class="mu">احفظ تقريرك كملف أو انسخه، وسيطلب منك معلمك لاحقًا تسليمه.</p><button class="b" onclick="dl()">⬇️ تنزيل ملف التقرير</button><p id="dm" class="mu" style="margin:6px 0 12px"></p><textarea id="rp" readonly onclick="this.select()"></textarea><div class="row"><button class="b" onclick="cp()">نسخ التقرير</button><button class="b g" onclick="start()">إعادة الاختبار</button></div><p id="cm" class="mu"></p></div><div class="c"><h2>مراجعة الإجابات</h2>';
Q.forEach(function(x,i){h+='<div style="margin-bottom:18px"><span class="tag">'+x.s+'</span><span class="tag d">'+x.d+'</span>'+(x.p?'<div class="psg" style="margin-top:8px">'+x.p+'</div>':'')+'<div class="q">'+(i+1)+'. '+x.q+'</div>';
x.o.forEach(function(t,j){h+='<div class="o '+(j===x.a?'ok':(j===ans[i]?'no':''))+'">'+t+'</div>'});
h+='<div class="ex">'+(ans[i]===undefined?'لم تُجب. ':'')+x.e+'</div></div>'});
app.innerHTML=h+'</div>';document.getElementById("rp").value=rep;window.scrollTo(0,0)}

m.textContent=done?"تم النسخ. الصقه الآن في المحادثة.":"تعذّر النسخ تلقائيًا؛ اضغط داخل الصندوق وانسخ النص يدويًا."}
